<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#0f172a"/>
  
  <!-- Glow effect -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.3"/>
  
  <!-- Main letter M shape with futuristic style -->
  <g transform="translate(20, 25)">
    <!-- Left vertical line -->
    <rect x="0" y="0" width="6" height="70" fill="#dc2626" rx="3"/>
    
    <!-- Right vertical line -->
    <rect x="82" y="0" width="6" height="70" fill="#dc2626" rx="3"/>
    
    <!-- Top left diagonal -->
    <path d="M 6 0 L 44 40" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Top right diagonal -->
    <path d="M 82 0 L 44 40" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Bottom left diagonal -->
    <path d="M 44 40 L 6 70" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Bottom right diagonal -->
    <path d="M 44 40 L 82 70" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Center accent dot -->
    <circle cx="44" cy="40" r="5" fill="#fca5a5" opacity="0.9"/>
  </g>
  
  <!-- Status indicator dot (online) -->
  <circle cx="108" cy="20" r="8" fill="#10b981" opacity="0.9"/>
  <circle cx="108" cy="20" r="5" fill="#34d399"/>
</svg>
